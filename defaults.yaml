# Defaults for the wardens bundled with the plugin (agents/). A project's .claude/wardens.yaml
# overrides any key per warden, e.g. to point debrief-scribe at your own docs directory:
#
#   wardens:
#     debrief-scribe:
#       owns:
#         - wiki/debriefs/**
wardens:
  debrief-scribe:
    kind: specialist
    owns:
      - docs/debriefs/**
    run:
      - git show
      - git diff
      - git log
  evidence-warden:
    kind: specialist
    owns:
      - docs/evidence/**
